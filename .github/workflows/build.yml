name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Publish Single File EXE
      run: |
        dotnet publish app/GHelper.csproj --configuration Release --runtime win-x64 -p:PublishSingleFile=true --no-self-contained
    - name: Create ZIP Artifact
      run: |
        powershell Compress-Archive app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper.exe app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper.zip
    - name: Upload GHelper Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GHelper-mod
        path: |
          app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper.exe
          app/bin/x64/Release/net10.0-windows/win-x64/publish/GHelper.zip
